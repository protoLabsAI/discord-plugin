id: discord
name: Discord
version: 0.2.0
description: >-
  Inbound Discord DM/@-mention gateway + outbound tools (ADR 0015/0016). A
  standalone protoAgent plugin (ADR 0018/0019) — install it from this repo and
  enable it; it's not bundled with the host. Off until a bot token is set in
  System → Settings → Discord. Disable with `plugins: { disabled: [discord] }`.
enabled: false                 # ships disabled — enabling is the operator's trust decision
repository: https://github.com/protoLabsAI/discord-plugin
min_protoagent_version: "0.34.0"
requires_env: []
# Config section (ADR 0019) — claims the top-level `discord` section, so the
# existing Settings group keeps working unchanged when installed.
config_section: discord
# Generic console Test button (ADR 0029) → POST /api/config/test-discord (this
# plugin's router) + a generic "Setup guide" link, so the console needs NO
# Discord-specific frontend (ADR 0059).
test: true
guide_url: "https://protolabsai.github.io/protoAgent/guides/discord#bot-setup"
# Console view (ADR 0026) — connection/bot status dashboard. The page is public
# (browser iframe can't carry a bearer); data is fetched from the gated
# /api/plugins/discord/* routes. public_paths needs a host with the plugin
# auth-exempt-paths feature; on older hosts the view simply 401s under a bearer.
views:
  - { id: discord, label: Discord, icon: MessageCircle, path: /plugins/discord/view, placement: right }
public_paths:
  - /plugins/discord/view
config:
  enabled: false
  admin_ids: []
secrets: [bot_token]
settings:
  - { key: enabled, label: "Enable Discord", type: bool, description: "Inbound DM gateway. Needs the bot token below; reconnects live on save." }
  - { key: bot_token, label: "Bot token", type: secret, description: "Discord bot token (Developer Portal → your app → Bot → Reset Token). Use “Test connection” to verify before saving." }
  - { key: admin_ids, label: "Admin user IDs", type: string_list, description: "Discord user IDs allowed to DM the bot (one per line). Empty = anyone." }
# Declarative transparency (shown in the console; not yet enforced). httpx +
# websockets are core host deps, so no requires_pip.
capabilities:
  network: ["discord.com", "*.discord.gg"]   # REST v10 + the gateway websocket
  filesystem: scoped                          # turn-log sqlite + return-address file in the scoped config dir
